services:
  postgres:
    image: postgres:16-alpine
    container_name: surelm_0_postgres
    environment:
      POSTGRES_DB: surelm_0
      POSTGRES_USER: ${POSTGRES_USER:-surelm_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or shell environment}
    command: ["postgres", "-c", "listen_addresses=*"]
    ports:
      - "6432:5432"
    volumes:
      - postgres_data_0:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surelm_dev_user} -d surelm_0"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: surelm_0_qdrant
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data_0:/qdrant/storage
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: surelm_0_keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env or shell environment}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/surelm_0
      KC_DB_USERNAME: ${POSTGRES_USER:-surelm_dev_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or shell environment}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 18444
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTPS_PORT: 8443
      KC_HTTPS_KEY_STORE_FILE: /opt/keycloak/conf/keycloak-dev.p12
      KC_HTTPS_KEY_STORE_PASSWORD: ${KC_HTTPS_KEY_STORE_PASSWORD:-keycloak}
      KC_HTTPS_KEY_STORE_TYPE: PKCS12
    ports:
      - "18444:8443"
    command: start
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./certs:/opt/keycloak/conf:ro
    restart: unless-stopped

volumes:
  postgres_data_0:
  qdrant_data_0:
